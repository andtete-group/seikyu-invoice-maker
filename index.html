<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seikyu｜かんたん請求書作成</title>
  <meta name="description" content="請求書を作成し、PDF保存や共有リンクで発行できます。">
  <style>
    :root{--ink:#15251e;--muted:#718078;--line:#dbe2de;--green:#174d38;--mint:#e9f2ed;--paper:#fff;--bg:#f1f3f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font:700 20px Georgia,serif;color:var(--ink);text-decoration:none}.brand span{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;font:700 17px sans-serif}.top-actions{display:flex;gap:10px}.button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:14px}.primary{background:var(--green);color:#fff;box-shadow:0 4px 10px #174d3825}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:30;background:#16271f;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px #0003;font-size:14px}.workspace{display:grid;grid-template-columns:minmax(390px,520px) 1fr;min-height:calc(100vh - 72px)}.editor{background:#fff;border-right:1px solid var(--line);padding:34px 40px 60px;overflow:auto}.editor-head{padding-bottom:26px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px!important;letter-spacing:.18em;color:#5c7668;font-weight:800}.editor h1{font:700 29px Georgia,"Yu Mincho",serif;margin:6px 0}.editor-head p{color:var(--muted);margin:5px 0;font-size:13px}.editor section{padding:25px 0;border-bottom:1px solid var(--line)}.editor h2{font-size:14px;margin:0 0 16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor label{display:block;color:#617068;font-size:11px;font-weight:700;letter-spacing:.03em}.editor input,.editor textarea,.editor select{width:100%;margin-top:7px;border:1px solid #d1d9d4;border-radius:7px;padding:10px 11px;background:#fbfcfb;color:var(--ink);font:inherit;font-size:13px;outline:none}.editor input:focus,.editor textarea:focus,.editor select:focus{border-color:#4e8068;box-shadow:0 0 0 3px #d9ebe1}.editor textarea{resize:vertical}.editor label+label{margin-top:13px}.section-title{display:flex;justify-content:space-between;align-items:center}.text-button{border:0;background:none;color:#276649;font-weight:700;cursor:pointer}.item-card{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:#f5f7f5;border-radius:9px;margin-bottom:10px}.item-card .wide{grid-column:1/-1}.item-card label+label{margin-top:0}.remove{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#869188;font-size:18px;cursor:pointer}.tax-row{display:grid;grid-template-columns:1fr 1fr 1.2fr;align-items:end;gap:12px;margin-top:16px}.tax-row label,.tax-row label+label{margin:0}.tax-row label:not(:last-child){display:flex;align-items:center;gap:7px;padding-bottom:10px}.tax-row input[type=radio]{width:auto;margin:0;accent-color:var(--green)}.preview-wrap{padding:45px 5vw 80px;overflow:auto}.invoice-paper{width:min(100%,820px);min-height:1060px;margin:auto;background:var(--paper);box-shadow:0 14px 45px #20302718;padding:64px 68px 45px;position:relative}.invoice-paper:before{content:"";height:7px;background:var(--green);position:absolute;inset:0 0 auto}.invoice-top{display:flex;justify-content:space-between;gap:40px}.customer{padding-top:42px;max-width:55%}.customer>p:first-child{font-size:10px;letter-spacing:.15em;color:#758079;font-weight:800;margin:0 0 10px}.customer h2{font:600 20px Georgia,"Yu Mincho",serif;margin:0 0 15px;border-bottom:1px solid #84958c;padding-bottom:8px}.customer h2 small{font:500 12px sans-serif}.multiline{white-space:pre-line}.customer p,.issuer p{font-size:11px;line-height:1.8;color:#67756e}.invoice-meta{text-align:right;min-width:255px}.invoice-meta h1{font:500 39px Georgia,"Yu Mincho",serif;letter-spacing:.2em;margin:0 0 30px}.invoice-meta dl{font-size:11px;margin:0}.invoice-meta dl div{display:flex;justify-content:flex-end;gap:20px;margin:8px 0}.invoice-meta dt{color:#7b8780}.invoice-meta dd{margin:0;min-width:115px}.issuer{display:flex;justify-content:flex-end;align-items:flex-start;gap:14px;text-align:right;margin:24px 0}.issuer b{font-size:13px}.issuer p{margin:6px 0}.seal{border:2px solid #a95d50;color:#a95d50;width:39px;height:39px;display:grid;place-items:center;border-radius:50%;font-weight:700;margin-top:2px}.amount-box{display:flex;align-items:baseline;gap:14px;border-top:2px solid var(--green);border-bottom:1px solid #aac0b4;padding:16px 4px;margin:34px 0}.amount-box span{font-size:12px;font-weight:700}.amount-box strong{font:600 29px Georgia,serif;margin-left:auto}.amount-box small{font-size:10px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--green);color:#fff;text-align:left;padding:11px 13px;font-size:10px;letter-spacing:.08em}th:nth-child(n+2),td:nth-child(n+2){text-align:right}td{padding:14px 13px;border-bottom:1px solid var(--line)}.summary{display:flex;justify-content:flex-end;margin-top:18px}.summary dl{width:45%;margin:0}.summary dl div{display:flex;justify-content:space-between;padding:8px 10px;font-size:11px}.summary dd{margin:0;font-weight:600}.summary .total{background:var(--mint);border-top:1px solid #91aa9d;padding:13px 10px;font-size:14px}.notes{margin-top:45px;border-top:1px solid var(--line);padding-top:15px;font-size:11px}.notes b{font-size:10px;letter-spacing:.1em}.notes p{color:#58665f;line-height:1.7}.invoice-paper footer{position:absolute;bottom:30px;left:68px;right:68px;text-align:center;border-top:1px solid var(--line);padding-top:14px;color:#8a958f;font-size:9px;letter-spacing:.08em}.workspace.shared{display:block}.shared .preview-wrap{padding-top:25px}.shared-banner{width:min(100%,820px);margin:0 auto 18px;background:#fff;border:1px solid var(--line);padding:14px 18px;border-radius:10px;display:flex;align-items:center;justify-content:space-between}.shared-banner div{display:flex;flex-direction:column;gap:3px}.shared-banner span{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.workspace{display:block}.editor{border-right:0}.preview-wrap{padding:30px 18px}.invoice-paper{padding:45px 38px;min-width:700px}.preview-wrap{overflow-x:auto}.topbar{padding:0 16px}.button{padding:10px 12px}.brand{font-size:0}.brand span{font-size:17px}.shared-banner{min-width:700px}}
    @media(max-width:520px){.editor{padding:28px 20px}.grid2{grid-template-columns:1fr}.top-actions{gap:6px}.secondary{font-size:0}.secondary:first-letter{font-size:16px}.tax-row{grid-template-columns:1fr 1fr}.tax-row label:last-child{grid-column:1/-1}}
    @media print{@page{size:A4;margin:0}body{background:#fff}.no-print{display:none!important}.workspace,.workspace.shared{display:block}.preview-wrap{padding:0;overflow:visible}.invoice-paper{width:210mm;min-height:297mm;box-shadow:none;margin:0;padding:16mm 18mm 12mm}.invoice-paper footer{left:18mm;right:18mm;bottom:10mm}}
  </style>
</head>
<body>
  <header class="topbar no-print"><a class="brand" href="./"><span>請</span> Seikyu</a><div class="top-actions"><button id="share" class="button secondary">↗ 共有リンクを発行</button><button class="button primary" onclick="print()">↓ PDFで保存</button></div></header>
  <div id="toast" class="toast no-print" hidden></div>
  <main id="workspace" class="workspace">
    <aside id="editor" class="editor no-print">
      <div class="editor-head"><p class="eyebrow">INVOICE BUILDER</p><h1>請求書を作成</h1><p>入力すると右の請求書にすぐ反映されます。</p></div>
      <section><h2>基本情報</h2><div class="grid2"><label>名目<input data-key="title"></label><label>発行日<input type="date" data-key="issueDate"></label><label>締め日<input type="date" data-key="closingDate"></label><label>支払日<input type="date" data-key="paymentDate"></label></div></section>
      <section><h2>宛先</h2><label>会社名<input data-key="customerName"></label><label>会社情報<textarea rows="3" data-key="customerInfo"></textarea></label></section>
      <section><h2>請求元</h2><label>会社名・屋号<input data-key="issuerName"></label><label>会社情報・振込先<textarea rows="4" data-key="issuerInfo"></textarea></label></section>
      <section><div class="section-title"><h2>請求内容</h2><button id="add" class="text-button">＋ 項目を追加</button></div><div id="items"></div><div class="tax-row"><label><input type="radio" name="taxMode" value="exclusive"> 税抜き</label><label><input type="radio" name="taxMode" value="inclusive"> 税込み</label><label>税率<select data-key="taxRate"><option value="10">10%</option><option value="8">8%</option><option value="0">0%</option></select></label></div></section>
      <section><h2>備考</h2><textarea rows="3" data-key="notes"></textarea></section>
    </aside>
    <section class="preview-wrap"><div id="sharedBanner" class="shared-banner no-print" hidden><div><b>請求書が届いています</b><span>内容をご確認のうえ、PDFとして保存できます。</span></div><button class="button primary" onclick="print()">↓ PDFで保存</button></div><article class="invoice-paper" id="paper"></article></section>
  </main>
  <script>
  const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const now=new Date(), initial={title:'請求書',issueDate:iso(now),closingDate:iso(new Date(now.getFullYear(),now.getMonth()+1,0)),paymentDate:iso(new Date(now.getFullYear(),now.getMonth()+2,0)),customerName:'株式会社サンプル',customerInfo:'〒100-0001\n東京都千代田区千代田1-1',issuerName:'あなたの会社名',issuerInfo:'〒150-0001 東京都渋谷区神宮前1-1\n登録番号：T1234567890123\n〇〇銀行 渋谷支店 普通 1234567',taxMode:'exclusive',taxRate:10,items:[{description:'制作・業務委託費',quantity:1,unitPrice:100000}],notes:'お振込手数料は貴社にてご負担ください。'};
  const decode=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
  const encode=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const params=new URLSearchParams(location.search); let shared=params.has('invoice'), data=shared?decode(params.get('invoice')):structuredClone(initial);
  const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(n));
  const jpDate=s=>s?new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric'}).format(new Date(s+'T00:00:00')):'—';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  function totals(){const entered=data.items.reduce((s,x)=>s+(+x.quantity||0)*(+x.unitPrice||0),0),subtotal=data.taxMode==='exclusive'?entered:entered/(1+data.taxRate/100),tax=data.taxMode==='exclusive'?subtotal*data.taxRate/100:entered-subtotal;return{subtotal,tax,total:data.taxMode==='exclusive'?subtotal+tax:entered}}
  function render(){document.querySelectorAll('[data-key]').forEach(el=>el.value=data[el.dataset.key]);document.querySelectorAll('[name=taxMode]').forEach(el=>el.checked=el.value===data.taxMode);document.getElementById('items').innerHTML=data.items.map((x,i)=>`<div class="item-card"><label class="wide">品目<input data-item="${i}" data-field="description" value="${esc(x.description)}"></label><label>数量<input type="number" min="0" data-item="${i}" data-field="quantity" value="${x.quantity}"></label><label>単価<input type="number" min="0" data-item="${i}" data-field="unitPrice" value="${x.unitPrice}"></label>${data.items.length>1?`<button class="remove" data-remove="${i}">×</button>`:''}</div>`).join('');const t=totals();document.getElementById('paper').innerHTML=`<div class="invoice-top"><div class="customer"><p>ご請求先</p><h2>${esc(data.customerName)}<small> 御中</small></h2><p class="multiline">${esc(data.customerInfo)}</p></div><div class="invoice-meta"><h1>${esc(data.title||'請求書')}</h1><dl><div><dt>発行日</dt><dd>${jpDate(data.issueDate)}</dd></div><div><dt>締め日</dt><dd>${jpDate(data.closingDate)}</dd></div><div><dt>お支払期限</dt><dd>${jpDate(data.paymentDate)}</dd></div></dl></div></div><div class="issuer"><div class="seal">請</div><div><b>${esc(data.issuerName)}</b><p class="multiline">${esc(data.issuerInfo)}</p></div></div><div class="amount-box"><span>ご請求金額</span><strong>${yen(t.total)}</strong><small>（税込）</small></div><table><thead><tr><th>品目</th><th>数量</th><th>単価</th><th>金額</th></tr></thead><tbody>${data.items.map(x=>`<tr><td>${esc(x.description||'—')}</td><td>${x.quantity}</td><td>${yen(x.unitPrice)}</td><td>${yen(x.quantity*x.unitPrice)}</td></tr>`).join('')}</tbody></table><div class="summary"><dl><div><dt>小計</dt><dd>${yen(t.subtotal)}</dd></div><div><dt>消費税（${data.taxRate}%）</dt><dd>${yen(t.tax)}</dd></div><div class="total"><dt>合計</dt><dd>${yen(t.total)}</dd></div></dl></div><div class="notes"><b>備考</b><p class="multiline">${esc(data.notes||'—')}</p></div><footer>この度はお取引いただき、誠にありがとうございます。</footer>`;bindItems()}
  function bindItems(){document.querySelectorAll('[data-item]').forEach(el=>el.oninput=()=>{const i=+el.dataset.item,f=el.dataset.field;data.items[i][f]=f==='description'?el.value:+el.value;renderPaperOnly()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{data.items.splice(+el.dataset.remove,1);render()})}
  function renderPaperOnly(){const active=document.activeElement,sel=active?.selectionStart;render();if(active?.dataset?.item!=null){const el=document.querySelector(`[data-item="${active.dataset.item}"][data-field="${active.dataset.field}"]`);el?.focus();try{el.setSelectionRange(sel,sel)}catch{}}}
  document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{data[el.dataset.key]=el.type==='number'?+el.value:el.value;renderPaperOnly()});document.querySelectorAll('[name=taxMode]').forEach(el=>el.onchange=()=>{data.taxMode=el.value;render()});document.getElementById('add').onclick=()=>{data.items.push({description:'',quantity:1,unitPrice:0});render()};document.getElementById('share').onclick=async()=>{const url=location.origin+location.pathname+'?invoice='+encode(data);await navigator.clipboard.writeText(url);const t=document.getElementById('toast');t.textContent='共有リンクをコピーしました。相手にそのまま送れます。';t.hidden=false;setTimeout(()=>t.hidden=true,3000)};
  if(shared){document.getElementById('workspace').classList.add('shared');document.getElementById('editor').remove();document.getElementById('share').remove();document.getElementById('sharedBanner').hidden=false}render();
  </script>
</body></html>
